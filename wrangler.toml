name = "openai-image-proxy"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"

workers_dev = true
routes = [
  { pattern = "mako.midgarcorp.cc", custom_domain = true },
  { pattern = "psywave.midgarcorp.cc", custom_domain = true }
]

[observability]
enabled = true

# Note: This file has multiple environments defined (production and development)
# Use --env="" for production or --env="development" for development deployment

[build]
command = "cargo install -q worker-build@0.1.14 && ~/.cargo/bin/worker-build --release --no-opt"

[vars]
# Deployment configuration
DEPLOYMENT_MODE = "official"  # This is the official hosted instance
REQUIRE_OWN_OPENAI_KEY = "false"

# OAuth Configuration
GITHUB_CLIENT_ID = "Ov23liVZ3rECA6jltb1f"
GOOGLE_CLIENT_ID = "720004930052-n4tdei4ua9shd2hqr1f6udmg5ijvj25j.apps.googleusercontent.com"
GOOGLE_DEVICE_CLIENT_ID = "720004930052-uiv67gpm9rpgj9ku2lq6ie4oiplrle6f.apps.googleusercontent.com"
APPLE_SERVICE_ID = "com.guitaripod.openai.image.proxy.service"
APPLE_TEAM_ID = "P4DQK6SRKR"
APPLE_KEY_ID = "V7GNRF2W6V"

# Service URLs
SERVICE_URL = "https://openai-image-proxy.guitaripod.workers.dev"
API_BASE_URL = "https://openai-image-proxy.guitaripod.workers.dev"

# Base of the image URLs mako returns: stored images load from {PUBLIC_BASE_URL}/r2/{user}/{image}.png through the
# public gateway. The worker's own host keeps serving /r2/ for URLs handed out before this variable existed.
PUBLIC_BASE_URL = "https://api.midgarcorp.cc/v1/intelligence"

# Environment
ENVIRONMENT = "production"

# P3.07 wallets. "on" links users who present a Midgar token to their Midgar ID wallet, resolves Midgar-ID-native
# requests and routes every credit change through the wallet when the user has a link. Anything else leaves every
# account on its D1 balance and runs none of that code. Needs the IDENTITY_LOOKUP_SECRET secret for grants addressed
# to a Midgar ID no user is linked to yet; see docs/p3.07-wallet-design.md.
WALLET_LINKING = "off"

# Identity tells mako when a Midgar ID is deleted (POST /internal/wallet/erase_all) or merged away (POST
# /internal/wallet/merge). Both routes need the WALLET_LIFECYCLE_SECRET secret, the same value on midgar-identity, and
# answer 404 without it. They work whether WALLET_LINKING is on or off, because the money stays in the wallet objects.

# P3.07 step 7. Not set: every provider call goes straight to its provider. Set AI_GATEWAY_BASE to
# "https://gateway.ai.cloudflare.com/v1/<account id>/<gateway id>" to send chat and Gemini calls through Cloudflare AI
# Gateway (OpenAI images and the realtime mint always stay direct); it needs the CF_AIG_TOKEN secret, and unsetting the
# variable and redeploying is the way back. See docs/p3.07-wallet-design.md, section 12.

# P3.07 step 9. "on" opens POST /internal/wallet/grant, where midgar-ledger forwards a verified consumable credit-pack
# transaction for a Midgar ID that is already linked, credited once under tx:<transactionId> (the key the RevenueCat
# webhook and the validate call share). Anything else hides the route (404). Needs the WALLET_INTERNAL_SECRET secret,
# the same value on midgar-ledger, and WALLET_LINKING = "on"; the ledger forwards only when its own LEDGER_GRANTS is on.
LEDGER_GRANTS = "off"

# Rate-limit enforcement switch. "false" = shadow (log would-be-limits, never
# block); "true" = enforce. Kept off until shadow logs confirm no legit traffic
# trips the generous per-user thresholds.
RL_ENFORCE = "true"

# Stripe Configuration
STRIPE_PUBLISHABLE_KEY = "pk_test_51QfJU6CLnJ2fO2EeJfP04Z5vnX4hxyUNFCGrxmCCT2K3jOXCsyDBGgRIcfzZJsUrNcgkUnuQBXGu0FWgTxbXHuOb00hNnE5yfO"

# OpenAI API key will be stored as a secret
# Run: npx wrangler secret put OPENAI_API_KEY

# OAuth secrets to be stored as secrets:
# Run: npx wrangler secret put GITHUB_CLIENT_SECRET
# Run: npx wrangler secret put GOOGLE_CLIENT_SECRET
# Run: npx wrangler secret put APPLE_PRIVATE_KEY

# Stripe keys to be stored as secrets:
# Run: npx wrangler secret put STRIPE_SECRET_KEY
# Run: npx wrangler secret put STRIPE_WEBHOOK_SECRET

# Stripe Price IDs - Set these in Cloudflare Dashboard under Workers > Settings > Variables
# or use wrangler secrets (though they're not truly secret, just configuration):
# STRIPE_PRICE_ID_STARTER
# STRIPE_PRICE_ID_BASIC
# STRIPE_PRICE_ID_POPULAR
# STRIPE_PRICE_ID_BUSINESS
# STRIPE_PRICE_ID_ENTERPRISE

# Sweeps realtime_sessions reservations that were charged up-front in /start but
# can never be settled (mint cancelled in flight, app killed/crashed mid-start),
# refunding the unused guard. See handlers::realtime::sweep_orphaned_reservations.
[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "openai-image-proxy"
database_id = "e77acafe-2e95-41e7-97a4-df05de7a5f9b"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "openai-image-proxy-images"

# Per-IP rate limit for the unauthenticated anonymous-registration endpoint.
# Native Workers Rate Limiting binding (counters cached on-machine, no DB
# round-trip). The handler fails OPEN if this binding is absent, so a legit user
# is never blocked by an infra/config fault. Requires wrangler >= 4.36.0 to
# deploy. period must be 10 or 60.
[[ratelimits]]
name = "ANON_REGISTER_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Per-(app,user) cap on the expensive metered POSTs (chat.completion, realtime
# start, image generation). Generous — no human reaches 60/min; a stolen key or
# runaway client is what this catches. Counted in-worker so it protects every
# hostname; fails open if the binding is absent. Enforced only when RL_ENFORCE.
[[ratelimits]]
name = "TENANT_WRITE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Per-(app,user) cap on the authenticated reads (balance, transactions). A client
# polls a few times a second at most, so 240/min is far above legit use; shields
# single-threaded D1 from a tight read loop. Fails open; enforced when RL_ENFORCE.
[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1003"
simple = { limit = 240, period = 60 }

# Wallet (P3.07): one SQLite-backed Durable Object per Midgar ID. Nothing in the
# fetch handler routes to it yet; see src/wallet/ and docs/p3.07-wallet-design.md.
[[durable_objects.bindings]]
name = "WALLET"
class_name = "Wallet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Wallet"]

[[services]]
binding = "IDENTITY"
service = "midgar-identity"

# StoreKit 2 verification (P3.07 follow-up): mako hands a client's signed transaction to the ledger, which verifies
# it against Apple Root CA - G3 and answers its decoded fields. Needs the LEDGER_VERIFY_SECRET secret, set to the same
# value on midgar-ledger; without it a signed purchase answers 409 credit_pending and RevenueCat's webhook credits it.
[[services]]
binding = "LEDGER"
service = "midgar-ledger"

# Development configuration
[env.development]
vars = { ENVIRONMENT = "development" }